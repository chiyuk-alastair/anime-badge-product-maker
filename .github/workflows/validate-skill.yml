name: Validate skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validate repository and skill
        run: python scripts/validate_repo.py

      - name: Test repeat installation on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $codexHome = Join-Path $env:RUNNER_TEMP "codex-home"
          .\scripts\install-skill.ps1 -CodexHome $codexHome
          .\scripts\install-skill.ps1 -CodexHome $codexHome
          $installed = Join-Path $codexHome "skills\anime-badge-product-maker"
          python scripts/validate_repo.py --installed-skill $installed

      - name: Test repeat installation on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          codex_home="$RUNNER_TEMP/codex-home"
          bash scripts/install-skill.sh "$codex_home"
          bash scripts/install-skill.sh "$codex_home"
          python scripts/validate_repo.py \
            --installed-skill "$codex_home/skills/anime-badge-product-maker"
