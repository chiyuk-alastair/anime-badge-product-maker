name: Bug report
description: Report a reproducible workflow, documentation, or validation defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the project. Do not upload private customer images or sensitive data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and at which workflow stage?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use a synthetic or redacted example whenever possible.
      placeholder: "1. Install...\n2. Invoke...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Codex version, operating system, and validator output if relevant.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private data, customer uploads, seller handles, prices, and watermarks.
          required: true
